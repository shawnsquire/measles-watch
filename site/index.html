<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Measles watch</title>
<style>
  :root{
    --paper:#EFF3EF;
    --ink:#152420;
    --muted:#5C6B62;
    --quiet:#2F6B4F;
    --active:#9A5B00;
    --link:#28527A;
    --rule:#C9D4CC;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131A16; --ink:#E4EAE5; --muted:#93A398;
      --quiet:#7FBE9E; --active:#E0A44C; --link:#8FB4DA; --rule:#2C3830;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main{max-width:640px; margin:0 auto; padding:28px 20px 64px}
  a{color:var(--link); text-decoration-thickness:1px; text-underline-offset:2px}
  a:focus-visible{outline:2px solid var(--link); outline-offset:2px}

  header p{margin:.2rem 0 0; color:var(--muted); font-size:.85rem}
  h1{font:600 1.05rem/1.2 Charter, Georgia, serif; margin:0; letter-spacing:.01em}

  /* Verdicts: the five-second answer */
  #verdicts{margin:28px 0 8px; padding:0; list-style:none}
  #verdicts li{
    font:400 1.45rem/1.3 Charter, Georgia, serif;
    margin:0 0 18px; padding-left:16px; border-left:3px solid var(--quiet);
  }
  #verdicts li.active{border-left-color:var(--active)}
  #verdicts li .where{display:block; font:600 .8rem/1.4 system-ui, sans-serif;
    color:var(--muted); margin-bottom:2px}

  section{margin-top:40px; border-top:1px solid var(--rule); padding-top:18px}
  section h2{font:600 1.15rem/1.3 Charter, Georgia, serif; margin:0 0 12px}
  h3{font:600 .85rem/1.4 system-ui,sans-serif; color:var(--muted); margin:20px 0 8px}

  ul.items{list-style:none; margin:0; padding:0}
  ul.items li{margin:0 0 14px; padding:0}
  .meta{display:block; color:var(--muted); font-size:.8rem; margin-top:1px}
  .dot{display:inline-block; width:.5em; height:.5em; border-radius:50%;
    background:var(--active); margin-right:.4em; vertical-align:.08em}

  .source-line{font-size:.9rem; margin:0 0 8px}
  .source-line .status{color:var(--muted); font-size:.8rem}
  .changed-lines{margin:6px 0 12px; padding:10px 12px; border-left:3px solid var(--active);
    font-size:.88rem}
  .changed-lines p{margin:0 0 6px}

  footer{margin-top:56px; color:var(--muted); font-size:.8rem; line-height:1.6}
  #cdc{margin-top:6px}
  .err{color:var(--active)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Measles watch</h1>
    <p id="stamp">Loading latest data…</p>
  </header>

  <ul id="verdicts"></ul>
  <div id="regions"></div>

  <footer>
    <p>Checks the Maryland Department of Health, Arizona DHS, and county health
       pages for changes, plus regional news, on a schedule. A colored edge means
       new activity since the last check. Not a substitute for the official pages —
       when in doubt, follow the links.</p>
    <p id="cdc"></p>
  </footer>
</main>

<script>
(async function(){
  const $ = (id)=>document.getElementById(id);
  let d;
  try{
    const res = await fetch('data.json', {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    d = await res.json();
  }catch(e){
    $('stamp').textContent = 'Could not load data.json — run fetch_measles.py once and redeploy.';
    $('stamp').className = 'err';
    return;
  }

  const when = new Date(d.generated_at);
  $('stamp').textContent = 'Checked ' + when.toLocaleString(undefined,
    {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});

  const esc = (s)=>{const t=document.createElement('span'); t.textContent=s; return t.innerHTML;};

  const verdicts = $('verdicts'), regions = $('regions');
  for(const r of d.regions){
    const changedPages = r.watch.filter(w=>w.changed);
    const freshNews = r.news.filter(n=>n.new);
    const activity = changedPages.length + freshNews.length;

    // Verdict line
    const li = document.createElement('li');
    if(activity) li.className = 'active';
    li.innerHTML = '<span class="where">'+esc(r.name)+'</span>' +
      (activity
        ? (changedPages.length ? changedPages.length+' official page'+(changedPages.length>1?'s':'')+' updated' : '') +
          (changedPages.length && freshNews.length ? ', ' : '') +
          (freshNews.length ? freshNews.length+' new news item'+(freshNews.length>1?'s':'') : '')
        : 'Quiet — nothing new since last check');
    verdicts.appendChild(li);

    // Region detail
    const sec = document.createElement('section');
    let html = '<h2>'+esc(r.name)+'</h2><h3>Official sources</h3>';
    for(const w of r.watch){
      html += '<p class="source-line"><a href="'+esc(w.url)+'">'+esc(w.name)+'</a> ' +
        '<span class="status">'+(w.ok ? (w.changed?'· updated':'· unchanged') : '· unreachable last run')+'</span></p>';
      if(w.changed && w.new_lines.length){
        html += '<div class="changed-lines">' +
          w.new_lines.map(l=>'<p>'+esc(l)+'</p>').join('') + '</div>';
      }
    }
    html += '<h3>Recent news</h3><ul class="items">';
    for(const n of r.news){
      const date = n.published ? new Date(n.published).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : '';
      html += '<li>'+(n.new?'<span class="dot" aria-label="new"></span>':'') +
        '<a href="'+esc(n.link)+'">'+esc(n.title)+'</a>' +
        '<span class="meta">'+esc([n.source,date].filter(Boolean).join(' — '))+'</span></li>';
    }
    html += '</ul>';
    sec.innerHTML = html;
    regions.appendChild(sec);
  }

  if(d.cdc) $('cdc').textContent =
    'CDC national count: '+d.cdc.cases+' confirmed cases as of '+d.cdc.as_of+'.';
})();
</script>
</body>
</html>
